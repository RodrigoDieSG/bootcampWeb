<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="calculadora">
    <div class="calculadora__pantalla" id="pantalla"></div>
    <div class="calculadora__botones">
      <!-- Fila 1 -->
      <button class="calculadora__boton" onclick="limpiarPantalla()">C</button>
      <button class="calculadora__boton" onclick="agregarValor('/')">/</button>
      <button class="calculadora__boton" onclick="agregarValor('*')">*</button>
      <button class="calculadora__boton" onclick="agregarValor('-')">-</button>
      <!-- Fila 2 -->
      <button class="calculadora__boton" onclick="agregarValor('7')">7</button>
      <button class="calculadora__boton" onclick="agregarValor('8')">8</button>
      <button class="calculadora__boton" onclick="agregarValor('9')">9</button>
      <button class="calculadora__boton" onclick="agregarValor('+')">+</button>
      <!-- Fila 3 -->
      <button class="calculadora__boton" onclick="agregarValor('4')">4</button>
      <button class="calculadora__boton" onclick="agregarValor('5')">5</button>
      <button class="calculadora__boton" onclick="agregarValor('6')">6</button>
      <button class="calculadora__boton calculadora__boton--igual" onclick="calcular()">=</button>
      <!-- Fila 4 -->
      <button class="calculadora__boton" onclick="agregarValor('1')">1</button>
      <button class="calculadora__boton" onclick="agregarValor('2')">2</button>
      <button class="calculadora__boton" onclick="agregarValor('3')">3</button>
      <button class="calculadora__boton" onclick="agregarValor('0')">0</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
